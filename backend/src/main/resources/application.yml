spring:
  application:
    name: uptimepulse-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uptimepulse}
    username: ${DB_USER:uptimepulse}
    password: ${DB_PASSWORD:uptimepulse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

uptimepulse:
  jwt:
    # SEC-1 FIX: no fallback default — app will fail at startup if JWT_SECRET env var is not set.
    # Set JWT_SECRET to a securely generated random string (min 256 bits) before running.
    secret: ${JWT_SECRET}
    expiration: 86400000   # 24 hours in ms

  monitor:
    stream-name: monitor-checks
    consumer-group: workers
    consumer-name: worker-1

  rate-limit:
    requests-per-minute: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    dev.uptimepulse: DEBUG
    org.springframework.security: WARN
